name: Build & Publish Docker Images

on:
  push:
    tags: [ 'v*.*.*' ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.service }}
        run: |
          docker build -t orderflow/${{ matrix.service }}:${{ github.ref_name }} -f ${{ matrix.service }}/Dockerfile .
