server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${SERVICES_AUTH_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service
          uri: ${SERVICES_USER_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**, /api/v1/admin/users/**

        - id: product-service
          uri: ${SERVICES_PRODUCT_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**, /api/v1/admin/products/**, /api/v1/admin/categories/**

        - id: inventory-service
          uri: ${SERVICES_INVENTORY_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/inventory/**, /api/v1/admin/inventory/**

        - id: order-service
          uri: ${SERVICES_ORDER_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/orders/**, /api/v1/admin/orders/**

        - id: payment-service
          uri: ${SERVICES_PAYMENT_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/payments/**, /api/v1/admin/payments/**

        - id: notification-service
          uri: ${SERVICES_NOTIFICATION_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/notifications/**, /api/v1/admin/notifications/**

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
